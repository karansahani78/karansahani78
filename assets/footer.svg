<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ft1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#ffa500;#00ff87;#00c8ff;#8000ff;#ff0080" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#ffa500">
        <animate attributeName="stop-color" values="#ffa500;#00ff87;#00c8ff;#8000ff;#ff0080;#ffa500" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#00ff87">
        <animate attributeName="stop-color" values="#00ff87;#00c8ff;#8000ff;#ff0080;#ffa500;#00ff87" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00c8ff">
        <animate attributeName="stop-color" values="#00c8ff;#8000ff;#ff0080;#ffa500;#00ff87;#00c8ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="scale" values="1,1;1.08,1.08;1,1" dur="2s" repeatCount="indefinite"/>
    <text x="500" y="38" font-family="Verdana, sans-serif" font-size="26" fill="url(#ft1)" font-weight="bold" text-anchor="middle">Code · Ship · Scale 🚀</text>
  </g>
  <text x="500" y="60" font-family="Verdana, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">© 2026 Karan Sahani — Built with ☕ and Spring Boot</text>
</svg>