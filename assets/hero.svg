<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="hBG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1023">
        <animate attributeName="stop-color" values="#0b1023;#0d1b2a;#150a33;#0b1023" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#172a45">
        <animate attributeName="stop-color" values="#172a45;#0a2e3d;#3d1066;#172a45" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="hBlob1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hBlob2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff">
        <animate attributeName="stop-color" values="#00c8ff;#ff0080;#ffa500;#00ff87;#00c8ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#ffa500;#00ff87;#00c8ff;#ff0080" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffa500">
        <animate attributeName="stop-color" values="#ffa500;#00ff87;#00c8ff;#ff0080;#ffa500" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hSub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cffb2"/>
      <stop offset="100%" stop-color="#23d5ab"/>
    </linearGradient>
    <linearGradient id="hShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hSubClip">
      <rect x="40" y="140" width="0" height="50">
        <animate attributeName="width" values="0;920" dur="3.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="hShineClip">
      <rect x="165" y="52" width="780" height="72" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1000" height="300" rx="24" fill="url(#hBG)"/>
  <ellipse cx="250" cy="90" rx="320" ry="200" fill="url(#hBlob1)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 40,20; -30,-10; 0,0" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="220" rx="360" ry="220" fill="url(#hBlob2)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -45,25; 25,-15; 0,0" dur="16s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-18 120 95;18 120 95;-18 120 95" dur="1.1s" repeatCount="indefinite"/>
    <text x="60" y="110" font-size="52">👋</text>
  </g>

  <text x="165" y="115" font-family="Verdana, sans-serif" font-size="54" font-weight="bold" fill="url(#hTitle)">
    Hi, I'm Karan Sahani
  </text>
  <g clip-path="url(#hShineClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-900,0;-900,0;900,0;900,0" dur="4s" repeatCount="indefinite"/>
      <rect x="-900" y="52" width="475" height="72" fill="url(#hShine)" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.2;0.8;1"/>
      </rect>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 165 115" to="360 165 115" dur="6s" repeatCount="indefinite"/>
    <text x="300" y="55" font-size="26">🚀</text>
  </g>

  <g clip-path="url(#hSubClip)">
    <text x="45" y="178" font-family="Verdana, sans-serif" font-size="24" font-weight="600" fill="url(#hSub)">
      ⚙️ Backend Developer &#160;|&#160; Java &amp; Spring Boot &#160;|&#160; Scalable Systems &amp; Microservices
    </text>
  </g>
  <rect x="40" y="142" width="26" height="34" rx="4" fill="#7cffb2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;860,0" dur="3.5s" fill="freeze"/>
  </rect>

  <rect x="40" y="212" width="920" height="52" rx="26" fill="#ffffff" fill-opacity="0.06">
    <animate attributeName="fill-opacity" values="0.06;0.12;0.06" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="330" y="245" font-family="Verdana, sans-serif" font-size="20" fill="#c8d6f0">🌐 Portfolio</text>
  <text x="490" y="245" font-family="Verdana, sans-serif" font-size="20" font-weight="bold" fill="#00d4aa">karansahani-portfolio.vercel.app</text>
  <path d="M 400 256 H 600" stroke="#00d4aa" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
</svg>