<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="hBG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1023">
        <animate attributeName="stop-color" values="#0b1023;#0d1b2a;#150a33;#0b1023" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#172a45">
        <animate attributeName="stop-color" values="#172a45;#0a2e3d;#3d1066;#172a45" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="hBlob1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hBlob2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff">
        <animate attributeName="stop-color" values="#00c8ff;#ff0080;#ffa500;#00ff87;#00c8ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#ffa500;#00ff87;#00c8ff;#ff0080" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffa500">
        <animate attributeName="stop-color" values="#ffa500;#00ff87;#00c8ff;#ff0080;#ffa500" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hSub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cffb2"/>
      <stop offset="100%" stop-color="#23d5ab"/>
    </linearGradient>
    <linearGradient id="hShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hSubClip">
      <rect x="40" y="118" width="0" height="34">
        <animate attributeName="width" values="0;900" dur="3.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="hShineClip">
      <rect x="170" y="24" width="770" height="58" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1000" height="250" rx="24" fill="url(#hBG)"/>
  <ellipse cx="240" cy="70" rx="300" ry="160" fill="url(#hBlob1)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 35,18; -25,-10; 0,0" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="770" cy="190" rx="330" ry="170" fill="url(#hBlob2)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,20; 22,-14; 0,0" dur="15s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-18 120 64;18 120 64;-18 120 64" dur="1.1s" repeatCount="indefinite"/>
    <text x="82" y="74" font-size="46">👋</text>
  </g>
  <text x="170" y="78" font-family="Verdana, sans-serif" font-size="50" font-weight="bold" fill="url(#hTitle)">Hi, I'm Karan Sahani</text>

  <g clip-path="url(#hShineClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-900,0;-900,0;900,0;900,0" dur="4s" repeatCount="indefinite"/>
      <rect x="-900" y="24" width="470" height="58" fill="url(#hShine)" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.2;0.8;1"/>
      </rect>
    </g>
  </g>

  <g clip-path="url(#hSubClip)">
    <text x="45" y="143" font-family="Verdana, sans-serif" font-size="22" font-weight="600" fill="url(#hSub)">
      ⚙️ Backend Developer &#160;|&#160; Java &amp; Spring Boot &#160;|&#160; Scalable Systems &amp; Microservices
    </text>
  </g>
  <rect x="45" y="122" width="18" height="23" rx="3" fill="#7cffb2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;800,0" dur="3.5s" fill="freeze"/>
  </rect>

  <rect x="298" y="170" width="410" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#00d4aa" stroke-width="2" stroke-dasharray="36 852">
    <animate attributeName="fill-opacity" values="0.05;0.1;0.05" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-888" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="503" y="193" font-family="Verdana, sans-serif" font-size="17" font-weight="bold" fill="#00d4aa" text-anchor="middle">🌐 karansahani-portfolio.vercel.app</text>

  <g>
    <animateTransform attributeName="transform" type="translate" values="-140,0;1120,0" dur="9s" repeatCount="indefinite"/>
    <text x="-20" y="222" font-size="24">🚀</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="1140,0;-160,0" dur="12s" repeatCount="indefinite"/>
    <text x="1160" y="234" font-size="17">🚀</text>
  </g>
</svg>