<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background:#0d1117;border-radius:14px">

  <text x="40" y="38" font-family="Verdana, sans-serif" font-size="17" fill="#7cffb2" font-weight="bold">Java &amp; Spring Boot</text>
  <rect x="40" y="46" width="380" height="13" rx="7" fill="#161b22"/>
  <rect x="40" y="46" width="380" height="13" rx="7" fill="#ff0080">
    <animate attributeName="width" values="0;380;380;0" dur="3.6s" repeatCount="indefinite" keyTimes="0;0.45;0.85;1"/>
  </rect>

  <text x="40" y="82" font-family="Verdana, sans-serif" font-size="17" fill="#66d9ff" font-weight="bold">Microservices &amp; Kafka</text>
  <rect x="40" y="90" width="380" height="13" rx="7" fill="#161b22"/>
  <rect x="40" y="90" width="352" height="13" rx="7" fill="#00c8ff">
    <animate attributeName="width" values="0;352;352;0" dur="3.9s" repeatCount="indefinite" keyTimes="0;0.45;0.85;1" begin="0.35s"/>
  </rect>

  <text x="40" y="126" font-family="Verdana, sans-serif" font-size="17" fill="#ffc45e" font-weight="bold">SQL &amp; NoSQL Databases</text>
  <rect x="40" y="134" width="380" height="13" rx="7" fill="#161b22"/>
  <rect x="40" y="134" width="323" height="13" rx="7" fill="#ffa500">
    <animate attributeName="width" values="0;323;323;0" dur="4.2s" repeatCount="indefinite" keyTimes="0;0.45;0.85;1" begin="0.7s"/>
  </rect>

  <text x="40" y="170" font-family="Verdana, sans-serif" font-size="17" fill="#6effb8" font-weight="bold">Docker · K8s · AWS · CI/CD</text>
  <rect x="40" y="178" width="380" height="13" rx="7" fill="#161b22"/>
  <rect x="40" y="178" width="285" height="13" rx="7" fill="#00ff87">
    <animate attributeName="width" values="0;285;285;0" dur="4.5s" repeatCount="indefinite" keyTimes="0;0.45;0.85;1" begin="1.05s"/>
  </rect>

  <g transform="translate(545,86)">
    <circle r="62" fill="none" stroke="#161b22" stroke-width="11"/>
    <circle r="62" fill="none" stroke="#ff0080" stroke-width="11" stroke-dasharray="389" stroke-dashoffset="389" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="389;54;54;389" dur="3.6s" repeatCount="indefinite" keyTimes="0;0.48;0.85;1"/>
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="4" font-family="Verdana, sans-serif" font-size="22" fill="#ff0080" font-weight="bold" text-anchor="middle">86%</text>
  </g>
  <text x="545" y="162" font-family="Verdana, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Backend Proficiency</text>

  <g transform="translate(735,86)">
    <circle r="62" fill="none" stroke="#161b22" stroke-width="11"/>
    <circle r="62" fill="none" stroke="#00c8ff" stroke-width="11" stroke-dasharray="389" stroke-dashoffset="389" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="389;130;130;389" dur="3.9s" repeatCount="indefinite" keyTimes="0;0.48;0.85;1" begin="0.3s"/>
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="4" font-family="Verdana, sans-serif" font-size="22" fill="#00c8ff" font-weight="bold" text-anchor="middle">67%</text>
  </g>
  <text x="735" y="162" font-family="Verdana, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Solution Design</text>

  <g transform="translate(925,86)">
    <circle r="62" fill="none" stroke="#161b22" stroke-width="11"/>
    <circle r="62" fill="none" stroke="#ffa500" stroke-width="11" stroke-dasharray="389" stroke-dashoffset="389" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="389;180;180;389" dur="4.2s" repeatCount="indefinite" keyTimes="0;0.48;0.85;1" begin="0.6s"/>
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="4" font-family="Verdana, sans-serif" font-size="22" fill="#ffa500" font-weight="bold" text-anchor="middle">54%</text>
  </g>
  <text x="925" y="162" font-family="Verdana, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">DevOps Tooling</text>
