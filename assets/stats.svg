<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background:#0d1117;border-radius:16px">

  <text x="40" y="52" font-family="Verdana, sans-serif" font-size="19" fill="#7cffb2" font-weight="bold">Java &amp; Spring Boot</text>
  <rect x="40" y="62" width="360" height="16" rx="8" fill="#161b22"/>
  <rect x="40" y="62" width="0" height="16" rx="8" fill="#ff0080">
    <animate attributeName="width" values="0;360;360;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.4;0.85;1"/>
  </rect>

  <text x="40" y="112" font-family="Verdana, sans-serif" font-size="19" fill="#66d9ff" font-weight="bold">Microservices &amp; Kafka</text>
  <rect x="40" y="122" width="360" height="16" rx="8" fill="#161b22"/>
  <rect x="40" y="122" width="0" height="16" rx="8" fill="#00c8ff">
    <animate attributeName="width" values="0;330;330;0" dur="4.3s" repeatCount="indefinite" keyTimes="0;0.4;0.85;1" begin="0.4s"/>
  </rect>

  <text x="40" y="172" font-family="Verdana, sans-serif" font-size="19" fill="#ffc45e" font-weight="bold">SQL &amp; NoSQL Databases</text>
  <rect x="40" y="182" width="360" height="16" rx="8" fill="#161b22"/>
  <rect x="40" y="182" width="0" height="16" rx="8" fill="#ffa500">
    <animate attributeName="width" values="0;300;300;0" dur="4.6s" repeatCount="indefinite" keyTimes="0;0.4;0.85;1" begin="0.8s"/>
  </rect>

  <text x="40" y="232" font-family="Verdana, sans-serif" font-size="19" fill="#6effb8" font-weight="bold">Docker · K8s · AWS · CI/CD</text>
  <rect x="40" y="242" width="360" height="16" rx="8" fill="#161b22"/>
  <rect x="40" y="242" width="0" height="16" rx="8" fill="#00ff87">
    <animate attributeName="width" values="0;270;270;0" dur="4.9s" repeatCount="indefinite" keyTimes="0;0.4;0.85;1" begin="1.2s"/>
  </rect>

  <g transform="translate(520,95)">
    <circle r="80" fill="none" stroke="#161b22" stroke-width="12"/>
    <circle r="80" fill="none" stroke="#ff0080" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="440" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="440;60;60;440" dur="4s" repeatCount="indefinite" keyTimes="0;0.45;0.85;1"/>
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" font-family="Verdana, sans-serif" font-size="26" fill="#ff0080" font-weight="bold" text-anchor="middle">86%</text>
  </g>
  <text x="520" y="201" font-family="Verdana, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Backend Proficiency</text>

  <g transform="translate(720,95)">
    <circle r="80" fill="none" stroke="#161b22" stroke-width="12"/>
    <circle r="80" fill="none" stroke="#00c8ff" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="440" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="440;120;120;440" dur="4.3s" repeatCount="indefinite" keyTimes="0;0.45;0.85;1" begin="0.3s"/>
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" font-family="Verdana, sans-serif" font-size="26" fill="#00c8ff" font-weight="bold" text-anchor="middle">73%</text>
  </g>
  <text x="720" y="201" font-family="Verdana, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Solution Design</text>

  <g transform="translate(920,95)">
    <circle r="80" fill="none" stroke="#161b22" stroke-width="12"/>
    <circle r="80" fill="none" stroke="#ffa500" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="440" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="440;180;180;440" dur="4.6s" repeatCount="indefinite" keyTimes="0;0.45;0.85;1" begin="0.6s"/>
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" font-family="Verdana, sans-serif" font-size="26" fill="#ffa500" font-weight="bold" text-anchor="middle">59%</text>
  </g>
  <text x="920" y="201" font-family="Verdana, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">DevOps Tooling</text>
</svg>