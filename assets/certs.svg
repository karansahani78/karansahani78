<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">

  <g>
    <animateTransform attributeName="transform" type="translate" values="-300,0;0,0;0,0;0,0" dur="5s" repeatCount="indefinite"/>
    <rect x="30" y="20" width="210" height="90" rx="14" fill="#0d1117" stroke="#00ea64" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="135" y="58" font-family="Verdana, sans-serif" font-size="16" fill="#00ea64" font-weight="bold" text-anchor="middle">✔ Problem Solving (Basic)</text>
    <text x="135" y="86" font-family="Verdana, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">HackerRank</text>
  </g>

  <g transform="translate(240,0)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-300,0;0,0" dur="5s" repeatCount="indefinite"/>
    <rect x="30" y="20" width="210" height="90" rx="14" fill="#0d1117" stroke="#00c8ff" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="135" y="58" font-family="Verdana, sans-serif" font-size="16" fill="#00c8ff" font-weight="bold" text-anchor="middle">✔ Problem Solving (Basic)</text>
    <text x="135" y="86" font-family="Verdana, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">HackerRank</text>
  </g>

  <g transform="translate(480,0)">
    <animateTransform attributeName="transform" type="translate" values="0,-300;0,0;0,0;0,-300;0,0" dur="5.5s" repeatCount="indefinite"/>
    <rect x="30" y="20" width="210" height="90" rx="14" fill="#0d1117" stroke="#ffa500" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="135" y="58" font-family="Verdana, sans-serif" font-size="16" fill="#ffa500" font-weight="bold" text-anchor="middle">✔ SQL (Advanced)</text>
    <text x="135" y="86" font-family="Verdana, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">HackerRank</text>
  </g>

  <g transform="translate(720,0)">
    <animateTransform attributeName="transform" type="rotate" values="0 135 65;6 135 65;0 135 65;-6 135 65;0 135 65" dur="2.6s" repeatCount="indefinite"/>
    <rect x="30" y="20" width="210" height="90" rx="14" fill="#0d1117" stroke="#ff0080" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="135" y="58" font-family="Verdana, sans-serif" font-size="16" fill="#ff0080" font-weight="bold" text-anchor="middle">✔ JAVA (Basic)</text>
    <text x="135" y="86" font-family="Verdana, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">HackerRank</text>
  </g>
</svg>