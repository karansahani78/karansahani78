  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 250" to="360 500 250" dur="24s" repeatCount="indefinite"/>
    <text x="380" y="404" font-size="36">🐬</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 250" to="360 500 250" dur="24s" repeatCount="indefinite"/>
    <text x="680" y="404" font-size="36">⚙️</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 250" to="360 500 250" dur="24s" repeatCount="indefinite"/>
    <text x="380" y="238" font-size="36">🐳</text>
  </g>

  <g>
