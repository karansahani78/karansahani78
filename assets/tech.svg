<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1000" height="380" rx="24" fill="#0d1117"/>

  <circle cx="500" cy="170" r="145" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 12">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="170" r="110" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 14">
    <animateTransform attributeName="transform" type="rotate" from="0 500 170" to="360 500 170" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="170" r="75" fill="none" stroke="#ff0080" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 9">
    <animate attributeName="stroke-dashoffset" values="0;44" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="scale" values="1,1;1.12,1.12;1,1" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="500" cy="170" r="44" fill="#161b22" stroke="#ff0080">
      <animate attributeName="stroke-width" values="2;5;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="488" y="181" font-family="Verdana, sans-serif" font-size="32" text-anchor="middle">🔥</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 170" to="360 500 170" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(645,170)"><text x="0" y="0" font-size="30" text-anchor="middle" dominant-baseline="central">☕</text></g>
    <g transform="translate(500,315)"><text x="0" y="0" font-size="30" text-anchor="middle" dominant-baseline="central">🐬</text></g>
    <g transform="translate(355,170)"><text x="0" y="0" font-size="30" text-anchor="middle" dominant-baseline="central">⚙️</text></g>
    <g transform="translate(500,25)"><text x="0" y="0" font-size="30" text-anchor="middle" dominant-baseline="central">🐳</text></g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 500 170" to="0 500 170" dur="17s" repeatCount="indefinite"/>
    <g transform="translate(610,170)"><text x="0" y="0" font-size="26" text-anchor="middle" dominant-baseline="central">🌱</text></g>
    <g transform="translate(500,280)"><text x="0" y="0" font-size="26" text-anchor="middle" dominant-baseline="central">☁️</text></g>
    <g transform="translate(390,170)"><text x="0" y="0" font-size="26" text-anchor="middle" dominant-baseline="central">📨</text></g>
    <g transform="translate(500,60)"><text x="0" y="0" font-size="26" text-anchor="middle" dominant-baseline="central">🐘</text></g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 170" to="360 500 170" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(575,170)"><text x="0" y="0" font-size="22" text-anchor="middle" dominant-baseline="central">📦</text></g>
    <g transform="translate(500,245)"><text x="0" y="0" font-size="22" text-anchor="middle" dominant-baseline="central">🍃</text></g>
    <g transform="translate(425,170)"><text x="0" y="0" font-size="22" text-anchor="middle" dominant-baseline="central">🔴</text></g>
    <g transform="translate(500,95)"><text x="0" y="0" font-size="22" text-anchor="middle" dominant-baseline="central">🌿</text></g>
  </g>

  <text x="500" y="332" font-family="Verdana, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Java · Spring · PostgreSQL · MySQL · Redis · Kafka · Docker · Kubernetes · AWS · Hibernate · Git · Maven</text>
  <text x="500" y="356" font-family="Verdana, sans-serif" font-size="13" fill="#484f58" text-anchor="middle">three synchronized orbits — every stack icon keeps circling</text>
</svg>