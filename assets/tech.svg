  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 500 250" to="0 500 250" dur="16s" repeatCount="indefinite"/>
    <text x="620" y="360" font-size="32">📨</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 500 250" to="0 500 250" dur="16s" repeatCount="indefinite"/>
    <text x="430" y="242" font-size="32">🐘</text>
  </g>

