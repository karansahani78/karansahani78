<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1000" height="500" rx="24" fill="#0d1117"/>

  <circle cx="500" cy="250" r="180" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="250" r="200" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 14">
    <animateTransform attributeName="transform" type="rotate" from="0 500 250" to="360 500 250" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="250" r="120" fill="none" stroke="#ff0080" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 8">
    <animate attributeName="stroke-dashoffset" values="0;50" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="scale" values="1,1;1.15,1.15;1,1" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="500" cy="250" r="52" fill="#161b22" stroke="#ff0080">
      <animate attributeName="stroke-width" values="2;6;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="455" y="265" font-family="Verdana, sans-serif" font-size="42">🔥</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 250" to="360 500 250" dur="24s" repeatCount="indefinite"/>
