<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="1.6s" repeatCount="indefinite"/>
    <rect x="120" y="28" width="140" height="64" rx="32" fill="#0a66c2">
      <animate attributeName="fill" values="#0a66c2;#4088cf;#0a66c2" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="132" y="40" width="28" height="28" rx="6" fill="#ffffff"/>
    <text x="168" y="63" font-family="Verdana, sans-serif" font-size="19" fill="#ffffff" font-weight="bold">in</text>
  </g>

  <g transform="translate(200,0)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="1.8s" repeatCount="indefinite"/>
    <rect x="120" y="28" width="140" height="64" rx="32" fill="#181818">
      <animate attributeName="fill" values="#181818;#3a3a3a;#181818" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(140,46)">
      <path d="M8 0 C4 0 0 4 0 8 v10 l4 -2 v6 c0 1.2 1 2 2 2 h4 c1.2 0 2 -0.8 2 -2 v-6 l4 2 V8 c0 -4 -4 -8 -8 -8 Z" fill="#ffffff"/>
    </g>
  </g>

  <g transform="translate(400,0)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="2s" repeatCount="indefinite"/>
    <rect x="120" y="28" width="140" height="64" rx="32" fill="#f18f01">
      <animate attributeName="fill" values="#f18f01;#ffb04d;#f18f01" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="165" y="68" font-family="Verdana, sans-serif" font-size="28" fill="#ffffff" font-weight="bold">⚡</text>
  </g>

  <g transform="translate(600,0)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="2.2s" repeatCount="indefinite"/>
    <rect x="120" y="28" width="160" height="64" rx="32" fill="#111111">
      <animate attributeName="fill" values="#111111;#2c2c2c;#111111" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#00ea64;#ffffff;#00ea64" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0;2;0" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="175" y="66" font-family="Verdana, sans-serif" font-size="22" fill="#00ea64" font-weight="bold">&lt;/&gt;</text>
  </g>
</svg>